# Slices 1-4 of the Powah port, as one flat SDK package: the carried blocks, items, models,
# textures, recipes, loot, tags and lang are the `assets/` and `data/` beside `src/`, and the
# behaviour is the one `impl Hooks` there. Licence: LGPL-3.0-only (Technici4n/Powah); the full
# text and its provenance are in LICENSE and LICENSE-NOTICE.md inside this package. Local-only
# until the maintainer approves publishing (ARCHITECTURE.md §8).
id = "powah"
name = "Powah"
version = "0.2.6"
description = """A port of Powah! (Rearchitected) for Horizon, slice 1: the starter tier of the energy
chain. The Furnator burns a furnace fuel into carbon and makes 20 FE/t into a 20,000 FE buffer
(one coal is 48,000 FE); the Energy Cell is a 1,000,000 FE capacitor that takes and gives 1,000
FE a side; the Energy Cable moves up to 500 FE/t between the block entities beside it and stores
nothing. All three declare a real block energy capability, so other machines can fill and drain
them. `/powah info|set` are the operator-only (level 2) harness controls (slice 1 has no GUI).
Slice 2 carries the dielectric/capacitor crafting family — dielectric paste, rods, casing and the
basic capacitor (six items, eight recipes) — so the three machine recipes craft.
Slice 3 makes a run of cables one network: every cable connected through cables forwards the same
charge (up to 500 FE/t for the network), so a cell three cables away from another is charged.
Slice 4 completes the energy cell ladder: the basic, hardened, blazing, niotic, spirited and nitro
cells carry their own capacity (4M/10M/40M/100M/400M/2G FE) and per-side transfer (4,000 up to
2,000,000 FE/t); `/powah set` clamps a cell at its tier's capacity.
Slice 5 carries the Energizing Orb: seven slots whose inputs match one of six energizing recipes,
a buffer filled by the energizing rods (seven tiers, 10,000 up to 20,000,000 FE, within four
blocks), and the materials it makes — energized steel and the blazing, niotic, spirited and nitro
crystals — so the five higher cell tiers, the large capacitor and the higher capacitor and rod
tiers now craft.
Slice 6 completes the furnator and cable ladders: six more furnators (80/200/800/2,000/8,000/40,000
FE/t into their own 80k…40M buffers, each giving at its own per-side rate) and six more cables
(2,000 up to 1,000,000 FE/t), a network joining only its own tier's cables.
Not yet ported: the creative cell, the generators, reactors, item charging, side config, redstone
modes and the GUIs."""
authors = ["owmii", "Technici4n", "AdLf0208"]
# A native mod: Rust in src/, compiled by the launcher against the game build [native] pins,
# beside the carried assets/ and data/. The id is the resource namespace and the only identity.
api = "0.2"
# "both" is the installation side, not a hook's: the machines run on the server, and a LAN host
# or single-player world runs it inside the client installation.
side = "both"
# The one shared value every manifest carries ("May add blocks, items, mob effects and entity
# types"); this package's content declares nine blocks, their items and nine block entity types.
capabilities = ["registries"]

[native]
game = "26.3"
horizon = "0a875da91dbb0fdcb7ba8c42c11341aa229af51a"
mixins = "e59da9094f0c2fdda6c627fe9eff22dec6a906f0"
